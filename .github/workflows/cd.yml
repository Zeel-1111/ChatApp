name: CD — Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish .NET app
        run: |
          dotnet publish ChatApplication/ChatApplication/ChatApplication.csproj \
            -c Release -o ./publish

      - name: Deploy via SSH (Template)
        # This is a template. You need to configure secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "Deploying to production..."
            # systemctl stop chatapp
            # cp -r ~/deploy/publish/* /opt/chatapp
            # systemctl start chatapp

  deploy-frontend:
    name: 🚀 Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ClientApp/chat-frontend/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build
        working-directory: ClientApp/chat-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Netlify (Template)
        # This is a template. You need to configure secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ClientApp/chat-frontend/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
